# GitHub Dependabot: suggests safe package updates as pull requests, once a week.
# Security fixes come separately (as soon as a problem is published).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # One pull request for all small, low-risk updates instead of many.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Expo and React Native versions must match the Expo SDK, so they're upgraded together
      # with `npx expo install --fix`, never one by one.
      - dependency-name: 'expo'
      - dependency-name: 'expo-*'
      - dependency-name: '@expo/*'
      - dependency-name: 'react'
      - dependency-name: 'react-dom'
      - dependency-name: 'react-native'
      - dependency-name: 'react-native-*'
      - dependency-name: '@react-native/*'
      - dependency-name: '@react-native-community/*'
      - dependency-name: '@react-native-async-storage/*'
      - dependency-name: '@maplibre/*'
      # Big (major) upgrades can break things; do those on purpose.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
